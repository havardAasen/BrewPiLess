; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
#env_default = development
#sonoff OTA no longer supported
#env_default = classic, classic-spanish, classic-portuguese-br, classic-slovak, classic-tw, newui, newui-tw, newui-spanish, newui-portuguese-br, newui-slovak,  newui-oled, thorrax, sonoff, sonoff-esp8285 , thorrax-classic


[env]
build_flags =
    -Wall
    -DREQUIRESALARMS=false

platform = espressif8266@4.2.1

monitor_speed = 115200
upload_speed = 921600

lib_ldf_mode=deep+

lib_deps =
    bblanchon/ArduinoJson@7.2.2
    marvinroger/AsyncMqttClient@0.8.2
    PaulStoffregen/OneWire@2.3.8
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
    milesburton/DallasTemperature@4.0.6
    ESP32Async/ESPAsyncTCP@2.0.0
    ESP32Async/ESPAsyncWebServer@3.10.3
    WereCatf/PCF8574_ESP@1.0.10

board_build.filesystem = littlefs


[env:native]
platform = native
lib_deps = google/googletest
test_framework = googletest
build_flags =
    -Wall
    -Wextra
    --std=c++17
build_unflags =
    --std=c++11


[env:clangtidy_native]
platform = native
check_tool = clangtidy
check_flags =
    clangtidy: --config-file=.clang-tidy
check_skip_packages = yes


[env:d1_mini]
board = d1_mini
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld


[env:d1_mini-debug]
extends = env:d1_mini
build_type = debug
monitor_filters = esp8266_exception_decoder
build_flags =
    ${env:d1_mini.build_flags}
    -DSerialDebug=true


[env:nodemcuv2]
board = nodemcuv2
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld


[env:thorrax]
board = nodemcuv2
framework = arduino
build_flags = -Wl,-Tesp8266.flash.4m2m.ld -DBOARD=Thorrak_PCB


[env:fs-d1_mini-en]
board = d1_mini
framework = arduino
targets = buildfs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
    -DWebPageLanguage=english
extra_scripts = post:script/copy_web_assets.py


[env:fs-d1_mini-spanish]
extends = env:d1_mini
targets = buildfs
build_flags =
    -DWebPageLanguage=spanish
extra_scripts = post:script/copy_web_assets.py


[env:fs-d1_mini-slovak]
extends = env:d1_mini
targets = buildfs
build_flags =
    -DWebPageLanguage=slovak
extra_scripts = post:script/copy_web_assets.py


[env:fs-d1_mini-portuguese-br]
extends = env:d1_mini
targets = buildfs
build_flags =
    -DWebPageLanguage=portuguese-br
extra_scripts = post:script/copy_web_assets.py


[env:fs-d1_mini-tw]
